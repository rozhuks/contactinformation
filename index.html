<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kontaktinformācija</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="form">
    <h1 class="heading">Nosūtīt ziņojumu</h1>

    <form id="form">

      <label for="name">Vārds</label>
      <input type="text" id="name" name="name" placeholder="Ievadiet vārdu...">
      <div class="error-message" id="name-error"></div>

      <label for="email">E-pasts</label>
      <input type="email" id="email" name="email" placeholder="Ievadiet e-pastu...">
      <div class="error-message" id="email-error"></div>

      <label for="message">Ziņojums</label>
      <textarea id="message" name="message" placeholder="Ievadiet ziņojumu..."></textarea>
      <div class="error-message" id="message-error"></div>

      <button type="submit">Nosūtīt</button>
    </form>
  </div>
  <script src="script.js"></script>
</body>
</html>
